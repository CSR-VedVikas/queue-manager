# Render Blueprint for the API. Database is on Neon; set DATABASE_URL and
# CORS_ORIGINS in the Render dashboard (they are secrets / deploy-specific).
services:
  - type: web
    name: queue-manager-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Apply pending migrations, refresh the demo data if it is over 1 hour
    # old (its timestamps are relative to when it was built), then start.
    # The free tier sleeps when idle, so this runs on most first visits.
    startCommand: alembic upgrade head && (python -m app.seed --if-stale-hours 1 || echo "demo seed skipped") && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Also allow this project's other Vercel deployment URLs
      # (frontend-<hash>-ved-projects10.vercel.app, frontend-git-<branch>-...).
      - key: CORS_ORIGIN_REGEX
        value: ^https://frontend(-[a-z0-9-]+)?-ved-projects10\.vercel\.app$
